<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Explorer - Catalogo Percorsi</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                <i class="bi bi-compass-fill text-primary"></i> GPX Explorer
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html"><i class="bi bi-house-door-fill me-1"></i> Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Header -->
    <header class="bg-primary text-white py-5 mb-4 shadow-sm bg-gradient">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2"><i class="bi bi-map-fill me-2"></i> Esplora le Migliori Tracce GPX</h1>
            <p class="lead mb-4 opacity-75">Trova itinerari outdoor per trekking e MTB, consulta il profilo altimetrico e scarica i file GPX.</p>
            
            <!-- Barra di Ricerca e Filtri -->
            <div class="row justify-content-center g-2 max-w-600 mx-auto bg-white p-3 rounded-4 shadow text-dark">
                <div class="col-md-7">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Cerca per nome o descrizione...">
                    </div>
                </div>
                <div class="col-md-5">
                    <select id="difficultyFilter" class="form-select">
                        <option value="all">Tutte le difficoltà</option>
                        <option value="Facile">Facile</option>
                        <option value="Media">Media</option>
                        <option value="Difficile">Difficile</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container Grid -->
    <main class="container flex-grow-1">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5" id="routesGrid">
            <!-- I percorsi verranno generati dinamicamente da JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-4 mt-auto border-top border-secondary">
        <div class="container text-center">
            <p class="mb-0 small">&copy; 2026 GPX Explorer &bull; Hosting su GitHub Pages &bull; Realizzato con Bootstrap 5</p>
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
